<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotorGraphico — diagramas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0b0e14; color: #e6edf3;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 14px 20px; border-bottom: 1px solid #1f2733; flex: 0 0 auto; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  header p { margin: 4px 0 0; color: #8b98a9; font-size: 12px; }
  nav { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid #1f2733; flex-wrap: wrap; flex: 0 0 auto; }
  nav button {
    background: #151b26; color: #c9d4e0; border: 1px solid #263041; border-radius: 7px;
    padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer;
  }
  nav button:hover { border-color: #3b82f6; color: #fff; }
  nav button[aria-current="true"] { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
  main { flex: 1 1 auto; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  footer { padding: 8px 20px; border-top: 1px solid #1f2733; color: #6b7787; font-size: 12px; flex: 0 0 auto; }
  footer a { color: #7aa2f7; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>MotorGraphico — 5 diagramas del motor C++ isométrico</h1>
  <p>Leídos del árbol de trabajo el 28/09/2026. Cada vista trae tema claro/oscuro, zoom, búsqueda y exportación PNG/SVG.</p>
</header>
<nav id="nav"></nav>
<main><iframe id="visor" title="Diagrama" src=""></iframe></main>
<footer>Fichero: <span id="ruta"></span> · <a id="nueva" href="#" target="_blank" rel="noopener">abrir en pestaña nueva</a></footer>
<script>
const DIAGRAMAS = [
  { id: "architecture", nombre: "Arquitectura",  fichero: "motor-architecture.html",
    desc: "12 componentes, frontera GL / núcleo GL-free y dependencias vendorizadas" },
  { id: "workflow", nombre: "Flujo", fichero: "motor-workflow.html",
    desc: "init() → bucle de paso fijo → fin de frame → shutdown(), con los fallos que abortan" },
  { id: "sequence", nombre: "Secuencia", fichero: "motor-sequence.html",
    desc: "Un frame real: ApplicationLoop, SceneManager, GameSession, renderer y HUD" },
  { id: "dataflow", nombre: "Datos", fichero: "motor-dataflow.html",
    desc: "Del JSON en disco al modelo GL-free y de ahí al píxel, la partida guardada y el PPM" },
  { id: "lifecycle", nombre: "Ciclo de vida", fichero: "motor-lifecycle.html",
    desc: "Pila de escenas (ADR-009): carga, pausa, transición diferida y fallo recuperable" }
];
const nav = document.getElementById("nav");
const visor = document.getElementById("visor");
const ruta = document.getElementById("ruta");
const nueva = document.getElementById("nueva");
let botones = [];

function seleccionar(i) {
  const d = DIAGRAMAS[i];
  visor.src = d.fichero;
  ruta.textContent = d.fichero;
  nueva.href = d.fichero;
  document.querySelector("header p").textContent = d.desc;
  botones.forEach((b, j) => b.setAttribute("aria-current", String(i === j)));
  if (location.hash !== "#" + d.id) history.replaceState(null, "", "#" + d.id);
}

DIAGRAMAS.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = d.nombre;
  b.title = d.desc;
  b.addEventListener("click", () => seleccionar(i));
  nav.appendChild(b);
  botones.push(b);
});

const inicial = Math.max(0, DIAGRAMAS.findIndex(d => d.id === location.hash.slice(1)));
seleccionar(inicial);
</script>
</body>
</html>
