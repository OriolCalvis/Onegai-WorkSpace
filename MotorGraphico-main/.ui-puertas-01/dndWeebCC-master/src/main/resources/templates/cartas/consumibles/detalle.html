<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Blocks/layout-gm :: layout}">
<head>
    <title layout:fragment="title">Carta de consumible</title>
</head>
<body>
<main layout:fragment="content">
            <div th:replace="~{Blocks/cartas-subnav-v2 :: subnav('consumibles')}"></div>

            <div class="u-page-header--start">
                <div>
                    <p class="gm-sidebar__eyebrow u-p-0">Ficha completa</p>
                    <h1 th:text="${carta.name}">Nombre</h1>
                    <p>
                        <span class="gm-badge" th:text="${carta.rarity}">common</span>
                        <span class="gm-badge">Tier <span th:text="${carta.tier}">1</span></span>
                        <span class="gm-badge" th:text="'ID ' + ${carta.id}">id</span>
                    </p>
                </div>
                <a class="gm-btn gm-btn--outline" th:href="@{/cartas/consumibles/{id}/editar(id=${carta.id})}">Editar</a>
            </div>

            <div class="u-detail-layout-300">
                <article class="gm-card gm-card--detalle u-cursor-default">
                    <span class="gm-card__tier">TIER <span th:text="${carta.tier}">1</span></span>
                    <h2 class="gm-card__title" th:text="${carta.name}">Nombre</h2>
                    <span class="gm-card__role" th:text="${carta.rarity}">common</span>

                    <div class="gm-card__illustration">🧪</div>

                    <div class="gm-card__rules">
                        <p class="gm-card__meta" th:text="${carta.actionType}">accion</p>
                        <p class="gm-card__desc u-clamp-unset" th:text="${carta.effect != null ? carta.effect.description : ''}">Descripción del efecto</p>
                        <p class="gm-card__meta u-italic" th:if="${carta.flavorText}" th:text="${carta.flavorText}">Texto narrativo</p>
                    </div>

                    <div class="gm-card__footer">
                        <span class="gm-badge" th:text="'Usos: ' + ${carta.uses}">Usos</span>
                    </div>

                    <p class="gm-card__id" th:text="'consumibles · ' + ${carta.id}">consumibles · id</p>
                </article>

                <div>
                    <div class="u-actions--wrap">
                        <a class="gm-btn gm-btn--outline" th:href="@{/cartas/consumibles}">Volver al listado</a>
                        <form th:action="@{/cartas/consumibles/{id}/eliminar(id=${carta.id})}" method="post" th:data-nombre="${carta.name}" onsubmit="return confirm(\'¿Borrar el consumible &quot;' + this.dataset.nombre + '&quot;? No se puede deshacer.');">
                            <button class="gm-btn gm-btn--danger" type="submit">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div></main>
</body>
</html>
