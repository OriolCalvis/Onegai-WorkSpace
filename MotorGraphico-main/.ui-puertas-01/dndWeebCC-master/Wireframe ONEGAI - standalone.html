document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nd',cursive}\n  .wf-dot{width:8px;height:8px;border-radius:50%;background:#888}\n  .wf-box{border:2px dashed #999;background:#ececec;color:#777;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}\n  .wf-line{height:10px;background:#d8d8d8;border-radius:2px}\n  .wf-note{background:#fff4d6;border:2px solid #c9a227;border-radius:4px;padding:8px 10px;font-size:14px;color:#5c4a06}\n  .wf-flag{position:absolute;background:#c0392b;color:#fff;font:700 11px 'Patrick Hand',cursive;padding:2px 7px;border-radius:3px;transform:rotate(-2deg)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t13\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t13\">13<\u002Fa><span class=\"dv-tname\">Historias multi-escena — acciones del jugador y sus consecuencias en cada lugar<\u002Fspan><\u002Fdiv>\n<div class=\"wf-note\" style=\"width:1180px;margin-bottom:22px\">\n<strong>Punto de partida:<\u002Fstrong> el esquema §10 de hoy (ver <a class=\"dv-oid\" href=\"#7e\">7e<\u002Fa>) es <em>plano<\u002Fem> — una historia = 1 gancho + 1 antagonista + 1 recompensa + 1 complicación, todo en un único lugar implícito. No hay forma de representar que una historia se mueva por <strong>varios lugares/momentos<\u002Fstrong>, cada uno con su propio reparto de enemigos/aliados/eventos/trampas/loot, ni de decir qué pasa según lo que decidan los jugadores ahí. Propongo extender el modelo con un array de <strong>escenas<\u002Fstrong> (lugar + contenido propio + acciones→consecuencias) y muestro dos formas de visualizarlo. Dato nuevo por escena: <code style=\"font-size:12px\">lugar, momento, enemigos[], aliados[], eventos[], trampas[], loot[], acciones:[{accion, consecuencia, lleva_a}]<\u002Fcode>.\n<\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"13a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#13a\">13a<\u002Fa>Línea de tiempo — escenas en orden, cada una con su tabla de acción→consecuencia<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:420px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /historias/contrabando_de_sal<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:14px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"wf-line\" style=\"width:160px\"><\u002Fdiv><span class=\"wf-box\" style=\"width:60px;height:20px;font-size:9px\">T1–T3<\u002Fspan><\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#2b2b2b\"><\u002Fdiv><div style=\"width:2px;flex:1;background:#ccc;min-height:120px\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"wf-box\" style=\"flex:1;flex-direction:column;align-items:flex-start;gap:5px;padding:8px;border-style:solid;background:#fff\">\n        <div style=\"display:flex;width:100%;justify-content:space-between;font-size:10px;font-weight:bold\">📍 Puerto de Mijorn — muelle <span style=\"font-weight:normal;color:#888\">de noche<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:3px\"><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">🧑 Adiel<\u002Fspan><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">💀 2× Contrabandista<\u002Fspan><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">🪤 Red oculta<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:9px;width:100%\">\n          <div style=\"font-weight:bold;color:#555\">Acción → Consecuencia<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span>Negociar con Adiel<\u002Fspan><span style=\"color:#888\">→ descuento, pero avisa a la guardia<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span>Atacar directo<\u002Fspan><span style=\"color:#888\">→ combate + pierde pista del alijo<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span>Seguir en sigilo<\u002Fspan><span style=\"color:#888\">→ va a escena 2 sin ser visto<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#2b2b2b\"><\u002Fdiv><div style=\"width:2px;flex:1;background:#ccc;min-height:90px\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"wf-box\" style=\"flex:1;flex-direction:column;align-items:flex-start;gap:5px;padding:8px;border-style:solid;background:#fff\">\n        <div style=\"font-size:10px;font-weight:bold\">📍 La Grieta — ruina costera<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:3px\"><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">👑 Contrabandista del Cierzo<\u002Fspan><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">📜 Evento: Caída del Puente<\u002Fspan><span class=\"wf-box\" style=\"height:16px;font-size:7px;padding:0 5px;width:auto\">💰 Alijo de Contrabandista<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:9px;width:100%\">\n          <div style=\"font-weight:bold;color:#555\">Acción → Consecuencia<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span>Entregarlo a la guardia<\u002Fspan><span style=\"color:#888\">→ recompensa oficial, sin loot<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span>Quedarse el alijo<\u002Fspan><span style=\"color:#888\">→ loot, facción Ecla se enfada<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:8px;align-items:flex-start\">\n      <div style=\"width:10px;height:10px;border-radius:50%;background:#2b2b2b;margin-top:6px\"><\u002Fdiv>\n      <div class=\"wf-box\" style=\"flex:1;font-size:9px;padding:8px;opacity:.6\">+ Añadir escena<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:420px\">Cada escena es un punto de la línea con su propio reparto (chips) y una mini-tabla de acciones posibles → qué pasa. Bueno para historias con orden fijo (el grupo recorre lugar 1, luego 2…), no representa bien un camino que se ramifique de verdad.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"13b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#13b\">13b<\u002Fa>Árbol de decisión — las consecuencias llevan a escenas distintas, no siempre en línea<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:420px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /historias/contrabando_de_sal<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:14px;display:flex;flex-direction:column;gap:8px\">\n    <div class=\"wf-box\" style=\"height:64px;flex-direction:column;align-items:flex-start;padding:6px;gap:3px;border-style:solid;background:#fff\">\n      <div style=\"font-size:10px;font-weight:bold\">📍 1 · Muelle de Mijorn<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:3px\"><span class=\"wf-box\" style=\"height:14px;font-size:7px;padding:0 5px;width:auto\">🧑 Adiel<\u002Fspan><span class=\"wf-box\" style=\"height:14px;font-size:7px;padding:0 5px;width:auto\">🪤 Red<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;padding-left:16px\">\n      <div style=\"width:2px;background:#ccc\"><\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;gap:6px;align-items:center\"><span style=\"font-size:8px;color:#888;width:110px\">Negociar →<\u002Fspan><div class=\"wf-box\" style=\"flex:1;height:26px;font-size:9px;justify-content:flex-start;padding:0 6px\">📍 2a · Bodega (aliado)<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;align-items:center\"><span style=\"font-size:8px;color:#888;width:110px\">Atacar →<\u002Fspan><div class=\"wf-box\" style=\"flex:1;height:26px;font-size:9px;justify-content:flex-start;padding:0 6px\">📍 2b · Combate en el muelle<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;align-items:center\"><span style=\"font-size:8px;color:#888;width:110px\">Sigilo →<\u002Fspan><div class=\"wf-box\" style=\"flex:1;height:26px;font-size:9px;justify-content:flex-start;padding:0 6px\">📍 2c · La Grieta (directo)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:20px;font-size:9px;opacity:.6\">+ Añadir rama desde cualquier escena<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:420px\">Cada acción es una rama que apunta a una escena distinta (2a/2b/2c pueden incluso reconverger). Representa mejor \"distintos caminos según lo que hagan los jugadores\", pero el editor visual es más complejo de construir que una lista lineal.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Prueba: \"desarrolla 13a con las 3 escenas completas de Contrabando de Sal\" · \"13b pero con las ramas reconvergiendo en una escena final común\" · \"añade este esquema de escenas a la carta 7e y al generador de 12b\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t12\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t12\">12<\u002Fa><span class=\"dv-tname\">Estudio: crear historias — hoy no existe pantalla, 3 formas de resolver la asimetría<\u002Fspan><\u002Fdiv>\n<div class=\"wf-note\" style=\"width:1180px;margin-bottom:22px\">\n<strong>Punto de partida (ver <a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa>):<\u002Fstrong> a diferencia de personaje (<a class=\"dv-oid\" href=\"#1f\">1f<\u002Fa>) y aventura (<a class=\"dv-oid\" href=\"#3b\">3b<\u002Fa>), las historias no tienen formulario — nacen en lote vía <code style=\"font-size:12px\">scripts/generar_historias_npcs.py<\u002Fcode> y se cargan como JSON en <code style=\"font-size:12px\">data/historias/<\u002Fcode>, siguiendo el esquema §10 (<code style=\"font-size:12px\">hook, antagonist, reward, complication, tierRange, facción<\u002Fcode>, ver carta <a class=\"dv-oid\" href=\"#7e\">7e<\u002Fa>). Problemas reales de esta asimetría:<br><br>\n1. <strong>Ninguna vía para crear UNA historia suelta<\u002Fstrong> desde la web — si un GM quiere una historia a medida (no generada en lote), no puede.<br>\n2. <strong>Lo generado por script no se revisa antes de guardar<\u002Fstrong> — el JSON entra directo a <code style=\"font-size:12px\">data/historias/<\u002Fcode>, sin pantalla intermedia para editar/descartar resultados antes de que aparezcan en el catálogo.<br>\n3. <strong>Sin vínculo visible con lo demás<\u002Fstrong> — el generador probablemente referencia PNJs/facciones/botín existentes (como en <a class=\"dv-oid\" href=\"#7e\">7e<\u002Fa>: antagonista, recompensa), pero no hay forma de ver o ajustar esos vínculos desde la web tampoco.<br><br>\nNo hay una única respuesta correcta — depende de si el generador por lote se quiere mantener como flujo principal o no.\n<\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"12a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#12a\">12a<\u002Fa>Formulario manual completo (igual que 3a/3b, sin script)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:340px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /historias/crear<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:7px\">\n    <div style=\"display:flex;gap:6px\"><div class=\"wf-box\" style=\"flex:1;height:22px;font-size:10px\">Nombre<\u002Fdiv><div class=\"wf-box\" style=\"width:70px;height:22px;font-size:10px\">Tier ▾<\u002Fdiv><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Facción / ubicación (gancho)<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:34px;font-size:10px\">Gancho (hook) — cómo se entera el grupo<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Antagonista — vincular PNJ/enemigo existente<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Recompensa — vincular tabla de botín<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:34px;font-size:10px\">Complicación<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:26px;background:#2b2b2b;color:#fff;font-size:9px;border-style:solid\">Guardar historia<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:340px\">Máximo control por historia, cero uso del script. Reemplaza el flujo de lote — si hoy se generan 300+ de golpe, escribir 300 a mano no es viable; sirve para casos sueltos, no para poblar el mundo.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"12b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#12b\">12b<\u002Fa>Generador con semilla + vista previa antes de guardar<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:340px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /historias/generar<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:7px\">\n    <div style=\"display:flex;gap:6px\"><div class=\"wf-box\" style=\"flex:1;height:20px;font-size:9px\">Facción ▾<\u002Fdiv><div class=\"wf-box\" style=\"width:60px;height:20px;font-size:9px\">Tier ▾<\u002Fdiv><div class=\"wf-box\" style=\"width:60px;height:20px;font-size:9px\">Cantidad<\u002Fdiv><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;background:#2b2b2b;color:#fff;font-size:9px;border-style:solid\">🎲 Generar (llama al script)<\u002Fdiv>\n    <div style=\"font-size:10px;font-weight:bold;margin-top:2px\">Previsualización (3 generadas)<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:50px;font-size:9px;flex-direction:column;align-items:flex-start;padding:6px;gap:2px;border-style:solid;background:#fff\">\n      <div style=\"display:flex;width:100%;justify-content:space-between\"><strong>Contrabando de Sal<\u002Fstrong><span class=\"wf-box\" style=\"width:20px;height:14px;font-size:8px\">✓<\u002Fspan><\u002Fdiv>\n      <span style=\"color:#888\">Antagonista: contrabandista_del_cierzo<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:34px;font-size:9px;opacity:.5\">Historia 2 — descartar ✕<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:24px;background:#2b2b2b;color:#fff;font-size:9px;border-style:solid\">Guardar seleccionadas (2)<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:340px\">Mantiene el script como motor pero resuelve el dolor #2: cada resultado se revisa/descarta antes de tocar disco, con checkbox de selección — el GM sigue generando en lote pero con control de calidad.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"12c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#12c\">12c<\u002Fa>Mantener solo el script, pero visibilizarlo en la web<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:340px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /historias<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:7px\">\n    <div class=\"wf-box\" style=\"height:34px;font-size:10px;flex-direction:column;gap:2px\">312 historias · última tanda: hace 4 días<br><span style=\"font-size:8px;color:#888\">generadas por script, fuera de la web<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px;opacity:.6\">+ Nueva historia (deshabilitado)<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:20px;font-size:9px\">🔍 Buscar / Filtro ▾<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:340px\">Opción más barata: no construye nada nuevo, solo deja explícito en la propia pantalla que el flujo vive fuera de la web (en vez de la ausencia silenciosa de hoy) — resuelve la confusión del dolor #1 sin resolver el problema en sí.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Prueba: \"desarrolla 12b a tamaño real con más historias en la previsualización\" · \"12a pero con botón 'generar sugerencia' que rellena los campos\" · \"¿el script ya vincula antagonista/recompensa o los deja vacíos?\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t11\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t11\">11<\u002Fa><span class=\"dv-tname\">Estudio: crear aventura (<a class=\"dv-oid\" href=\"#3b\">3b<\u002Fa>) — qué falla<\u002Fspan><\u002Fdiv>\n<div class=\"wf-note\" style=\"width:1180px;margin-bottom:22px\">\n<strong>Diagnóstico sobre <a class=\"dv-oid\" href=\"#3b\">3b<\u002Fa> tal como está hoy:<\u002Fstrong><br><br>\n1. <strong>Mismo problema que <a class=\"dv-oid\" href=\"#1h\">1h<\u002Fa> señaló para personaje:<\u002Fstrong> una sola página larguísima sin pasos — aquí es peor, porque además de Identidad hay 3 bloques temáticos (Historias/Reparto/Botín/Combates) que podrían ser pasos naturales de un wizard.<br>\n2. <strong>Picker de facciones sin buscador ni jerarquía<\u002Fstrong> — \"Facción A\" expandida, \"…14 facciones más\" colapsado en texto plano: el mismo dolor #2 que ya detecté en la leyenda del mapa (<a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa>/<a class=\"dv-oid\" href=\"#4c\">4c<\u002Fa>), aquí sin resolver.<br>\n3. <strong>Botones 🎲 \"al azar\" sin vista previa<\u002Fstrong> — tirar reparto/botín/trampas al azar reemplaza el contenido sin mostrar qué salió ni permitir re-tirar un solo elemento; es una caja negra.<br>\n4. <strong>Contador final dice \"Tramas 0\"<\u002Fstrong> pero \"trama\" no aparece definido en ningún otro sitio del formulario ni del esquema — término suelto que no se corresponde con ningún campo visible (¿historias? ¿combates?).<br>\n5. <strong>Combates preparados<\u002Fstrong> es un generador por tier (1 élite + 2-4 criaturas) pero el resultado tirado no se ve en la miniatura — solo \"sin enemigos\" o nada, sin lista de qué salió.\n<\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"11a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#11a\">11a<\u002Fa>Wizard de 4 pasos (Identidad → Historias → Reparto/Botín → Combates)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:340px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /aventuras/crear<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;gap:4px\">\n      <span class=\"wf-box\" style=\"flex:1;height:20px;font-size:9px;background:#2b2b2b;color:#fff;border-style:solid\">① Identidad<\u002Fspan>\n      <span class=\"wf-box\" style=\"flex:1;height:20px;font-size:9px\">② Historias<\u002Fspan>\n      <span class=\"wf-box\" style=\"flex:1;height:20px;font-size:9px\">③ Reparto/Botín<\u002Fspan>\n      <span class=\"wf-box\" style=\"flex:1;height:20px;font-size:9px\">④ Combates<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">Nombre<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">Descripción breve<\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;justify-content:flex-end;gap:6px\"><div class=\"wf-box\" style=\"width:100px;height:24px;font-size:9px;background:#2b2b2b;color:#fff;border-style:solid\">Siguiente →<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div clas 002Fdiv>\n\n<div class=\"dv-opt\" id=\"11c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#11c\">11c<\u002Fa>Vista previa tras cada tirada 🎲 (reparto/botín/combate)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:340px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /aventuras/crear<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:6px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:11px;font-weight:bold\">🧑 PNJs<\u002Fspan><span class=\"wf-box\" style=\"width:70px;height:18px;font-size:8px\">🎲 Retirar todo<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:24px;font-size:9px;justify-content:flex-start;padding:0 8px\">Mercader Adiel <span style=\"margin-left:auto;font-size:8px\">🎲 ⟳<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:24px;font-size:9px;justify-content:flex-start;padding:0 8px\">Guardia Costa <span style=\"margin-left:auto;font-size:8px\">🎲 ⟳<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:11px;font-weight:bold;margin-top:4px\">⚔ Combate 1 — generado<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:40px;font-size:9px;flex-direction:column;align-items:flex-start;padding:6px;gap:2px\">\n      <span>👑 Élite: Rei Llop Despierto<\u002Fspan><span>💀 ×3 Espectro del Cierzo<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:340px\">Cada tirada se muestra como lista editable con botón de re-tirar por elemento (⟳), no una caja negra — resuelve el dolor #3 y #5 a la vez.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Prueba: \"combina 11a+11b+11c en un solo flujo\" · \"aclara qué significa 'Tramas' o quítalo del HUD\" · \"aplica el mismo wizard a crear personaje (<a class=\"dv-oid\" href=\"#1f\">1f<\u002Fa>)\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t10\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t10\">10<\u002Fa><span class=\"dv-tname\">PNJs — crear y ver ficha (solo la carta de catálogo <a class=\"dv-oid\" href=\"#7d\">7d<\u002Fa>)<\u002Fspan><\u002Fdiv>\n<div class=\"wf-note\" style=\"width:1180px;margin-bottom:22px\">No hay formulario de creación ni página de ficha de PNJ en el código actual — <code style=\"font-size:12px\">/npcs<\u002Fcode> solo lista el álbum filtrable (patrón <a class=\"dv-oid\" href=\"#2b\">2b<\u002Fa>) y abre directo la carta de catálogo. Estas dos opciones proponen cómo serían, siguiendo el esquema §12 (<code style=\"font-size:12px\">agenda, palanca, secretHook, facción, mes, rol<\u002Fcode>) y el mismo lenguaje visual de <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>/<a class=\"dv-oid\" href=\"#1g\">1g<\u002Fa>.<\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"10a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#10a\">10a<\u002Fa>Crear PNJ — formulario<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:360px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /npcs/crear<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:7px\">\n    <div style=\"display:flex;gap:6px\"><div class=\"wf-box\" style=\"flex:1;height:22px;font-size:10px\">Nombre<\u002Fdiv><div class=\"wf-box\" style=\"width:100px;height:22px;font-size:10px\">Rol ▾<\u002Fdiv><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Facción / ubicación<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Mes (trasfondo narrativo)<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:34px;font-size:10px\">Agenda — qué quiere conseguir<\u002Fdiv>\n    <div style=\"display:flex;gap:6px\"><div class=\"wf-box\" style=\"flex:1;height:22px;font-size:10px\">Palanca (con qué negocia)<\u002Fdiv><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:34px;font-size:10px\">Secreto (secretHook) — solo lo ve el GM<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ Vincular historia (opcional)<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:26px;background:#2b2b2b;color:#fff;font-size:9px;border-style:solid\">Guardar PNJ<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:360px\">Más corto que crear personaje/aventura — sin stats de combate, solo lo narrativo. \"Secreto\" se marca visible solo al GM (ojo tachado) para diferenciarlo del resto de campos.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"10b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#10b\">10b<\u002Fa>Ficha de PNJ — vista de GM (agenda + secreto visibles)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:360px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /npcs/mercader_adiel<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\"><div class=\"wf-line\" style=\"width:120px\"><\u002Fdiv><div class=\"wf-box\" style=\"width:44px;height:18px;font-size:9px\">Editar<\u002Fdiv><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:90px;font-size:26px\">🧑<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:20px;font-size:10px;justify-content:flex-start;padding:0 8px\">Mercader · Puerto de Mijorn<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:40px;font-size:10px;flex-direction:column;align-items:flex-start;padding:6px;gap:2px\"><strong>Agenda<\u002Fstrong><span style=\"color:#888\">Recuperar una deuda del gremio de Ecla<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:26px;font-size:10px;justify-content:flex-start;padding:0 8px\">Palanca: oro<\u002Fdiv>\n    <div px;height:20px;font-size:8px;border-style:solid\">🟥 Ecla<\u002Fspan>\n      <span class=\"wf-box\" style=\"width:56px;height:20px;font-size:8px;border-style:dashed;opacity:.5;text-decoration:line-through\">🟦 Ostad<\u002Fspan>\n      <span class=\"wf-box\" style=\"width:56px;height:20px;font-size:8px;border-style:solid\">🟩 Giladdokx<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:10px;font-weight:bold;margin-top:2px\">Facciones <span style=\"font-weight:normal;font-size:9px\">16<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px\">\n      <span class=\"wf-box\" style=\"width:70px;height:20px;font-size:8px;border-style:solid\">🐺 Rei Llop<\u002Fspan>\n      <span class=\"wf-box\" style=\"width:60px;height:20px;font-size:8px;border-style:solid\">⚓ Corsarios<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:8px;color:#888\">3 nación(es) oculta(s) — <u>mostrar todo<\u002Fu><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:340px\">No añade foco ni capas — solo arregla lo que ya hay: mismo trazo visual borde-sólido/discontinuo en ambas listas (unifica el lenguaje del dolor #1), buscador de texto para los 35 chips, y un contador \"X ocultos + mostrar todo\" para que el estado de filtro nunca se olvide (dolor #4). El más barato de construir, no cubre el roadmap del doc.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Prueba: \"desarrolla <a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa> a tamaño real\" · \"combina 4b con el buscador de 4a\" · \"¿cómo se ve 4a en modo foco activo sobre el SVG completo?\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t3\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t3\">3<\u002Fa><span class=\"dv-tname\">Zoom: crear personaje, crear aventura, crear historia<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"3a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>Crear personaje — detalle de seccione >▾ 👑 Villanos 🎲<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ 💀 Enemigos sueltos 🎲<\u002Fdiv>\n    <div style=\"font-size:11px;font-weight:bold;margin-top:2px\">💰 Botín y peligros<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ 💰 Tablas de botín 🎲<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:22px;font-size:10px\">▾ 🪤 Trampas 🎲<\u002Fdiv>\n    <div style=\"font-size:11px;font-weight:bold;margin-top:2px\">⚔ Combates preparados<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:56px;flex-direction:column;font-size:9px;gap:3px;align-items:flex-start;padding:6px\">\n      <div style=\"display:flex;gap:4px;width:100%\"><span class=\"wf-box\" style=\"flex:1;height:16px;font-size:8px\">Nombre combate<\u002Fspan><span class=\"wf-box\" style=\"width:40px;height:16px;font-size:8px\">Tier<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:8px;color:#888\">⚔ sin enemigos — 🎲 Generar enemigos<\u002Fdiv>\n      <div class=\"wf-box\" style=\"width:100%;height:14px;font-size:7px\">Notas del combate<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:20px;font-size:9px\">+ Añadir combate<\u002Fdiv>\n    <div class=\"wf-box\" style=\"height:26px;background:#2b2b2b;color:#fff;font-size:9px;border-style:solid\">📜 Historias 0 · 🧵 Tramas 0 · Guardar aventura<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:360px\">Formulario más \"de director de juego\" que el de personaje: botones 🎲 para tirar al azar reparto/botín/trampas, y un generador de encuentros por tier que arma 1 élite + 2-4 criaturas. También larguísimo y de una sola página, con su propio HUD al fondo.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"3c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa>Crear historia — no existe como pantalla<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:280px;background:#f2f2f2\">\n  <div style=\"padding:16px;font-size:14px;color:#555;text-align:center\">\n    <div style=\"font-size:28px;margin-bottom:6px\">🚫<\u002Fdiv>\n    Sin formulario. Las historias se generan por lote con\n    <code style=\"font-size:12px\">scripts/generar_historias_npcs.py<\u002Fcode> y se cargan como JSON en\n    <code style=\"font-size:12px\">data/historias/<\u002Fcode> — solo hay lista (2b) y detalle, ningún botón \"+ Nueva historia\".\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-note\" style=\"width:280px\">A diferencia de personajes/aventuras (formulario en la web), las +300 historias nacen de un script Python fuera de la app. Coherente con \"no texto libre en personajes\", pero es una asimetría a tener en cuenta si algún día se quiere crear una historia suelta desde la web.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Prueba: \"convierte <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa> en un wizard de 4 pasos\" · \"diseña un formulario web para crear historias sueltas\" · \"simplifica los pickers 🎲 de <a class=\"dv-oid\" href=\"#3b\">3b<\u002Fa>\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\">2<\u002Fa><span class=\"dv-tname\">Resto de pantallas — mundo narrativo, exportaciones y configuración<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>Mapa Mundi (/mapa) — interactivo<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:380px\">\n  <div class=\"wf-bar\"><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span class=\"wf-dot\"><\u002Fspan><span style=\"margin-left:8px\">🏠 /mapa<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;gap:6px\"><div class=\"wf-box\" style=\"height:20px;font-size:9px;flex:1\">🖊️ Modo edición<\u002Fdiv><div class=\"wf-box\" style=\"height:20px;font-size:9px;flex:1\">💾 Guardar<\u002Fdiv><div class=\"wf-box\" style=\"he
