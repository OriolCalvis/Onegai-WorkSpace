repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        files: ^MotorGraphico/(include|src|examples)/.*\.(h|hpp|cpp)$

  - repo: local
    hooks:
      # LEY DEL REPOSITORIO — la puerta local. Instantanea: include(cmake/...)
      # con su fichero versionado, y ningun simbolo definido dos veces.
      - id: repo-configura
        name: configura, y sin simbolos duplicados
        entry: python3 MotorGraphico/tools/linea_base_core.py --rapido --indice
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # La guardia entera (~15 s): techo de 500, estado por clase, frontera
      # GL, muertos y logica dentro de las pruebas. La lista puede bajar.
      - id: linea-base-core
        name: la deuda medida no sube
        entry: python3 MotorGraphico/tools/linea_base_core.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: build-demo-debug
        name: build demo_resource_manager (Debug)
        entry: bash -c 'cd MotorGraphico && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug >/dev/null && cmake --build build --target demo_resource_manager -j'
        language: system
        pass_filenames: false
        stages: [pre-push]
