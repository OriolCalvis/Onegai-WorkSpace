spring.application.name=dndWeebCC

# Dev en vivo: cambios en plantillas Thymeleaf se reflejan al recargar, sin reiniciar.
# En producción (jar sin devtools) Spring Boot vuelve a activar la caché automáticamente.
spring.thymeleaf.cache=false

# Copia de seguridad de data/ en cada arranque (tarea Z2 · CopiaSeguridadDatos).
# Comprime data/ en data_backup/ y conserva las N copias más recientes.
onegai.backup.enabled=true
onegai.backup.keep=10
