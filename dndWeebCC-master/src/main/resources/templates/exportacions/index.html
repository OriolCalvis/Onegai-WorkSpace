<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exportacions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link th:href="@{/css/utilities.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{Blocks/header :: header}"></div>
<main class="container page-shell">
    <div th:replace="~{Blocks/sidebar :: sidebar}"></div>
    <section class="content-card"><p class="eyebrow">Serveis</p>
        <h1 class="h2 mb-4">Servlets d'exportació assignats</h1>
        <table class="table">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Ruta</th>
                <th>Tipus</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exportacio : ${exportacions}">
                <td th:text="${exportacio.nom}">Nom</td>
                <td><code th:text="${exportacio.ruta}">Ruta</code></td>
                <td th:text="${exportacio.tipus}">Tipus</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<div class="container" th:replace="~{Blocks/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
