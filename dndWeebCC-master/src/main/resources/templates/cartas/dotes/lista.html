<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Blocks/layout-gm :: layout}">
<head>
    <title layout:fragment="title">Cartas de Dote</title>
</head>
<body>
<main layout:fragment="content">
            <div th:replace="~{Blocks/cartas-subnav-v2 :: subnav('dotes')}"></div>

            <div class="u-page-header">
                <div>
                    <p class="gm-sidebar__eyebrow u-eyebrow">Sistema de Cartas y Tiers</p>
                    <h1>Álbum de Dotes</h1>
                </div>
                <div class="u-flex-gap2">
                    <button type="button" class="gm-btn gm-btn--outline" data-panel-anchor-toggle="gm-filtros">🔍 Filtros</button>
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/dotes/nueva}">+ Nueva dote</a>
                </div>
            </div>

            <div class="u-detail-layout-260">
                <!-- Panel anclado: filtros -->
                <aside id="gm-filtros" class="gm-panel gm-panel--anchored">
                    <div class="gm-panel__header">
                        <h3 class="gm-panel__title">Filtrar</h3>
                    </div>
                    <div class="gm-panel__body">
                        <div class="gm-field">
                            <label for="filtro-texto">Buscar por nombre</label>
                            <input id="filtro-texto" class="gm-input" type="text" placeholder="Ej. Reflejos de Acero...">
                        </div>
                        <div class="gm-field">
                            <label for="filtro-rareza">Rareza</label>
                            <select id="filtro-rareza" class="gm-select">
                                <option value="">Todas</option>
                                <option value="common">Común</option>
                                <option value="uncommon">Poco común</option>
                                <option value="rare">Rara</option>
                                <option value="epic">Épica</option>
                            </select>
                        </div>
                        <p class="gm-hint" id="filtro-resultado"></p>
                    </div>
                </aside>

                <div>
                    <p class="u-text-muted" th:if="${#lists.isEmpty(cartas)}">
                        Todavía no has creado ninguna carta de dote. Empieza con la primera.
                    </p>

                    <div class="gm-album" id="gm-album-dotes">
                        <article class="gm-card" th:each="carta : ${cartas}"
                                  th:attr="data-panel-source='panel-tpl-' + ${carta.id}, data-panel-title=${carta.name}, data-rareza=${carta.rarity}, data-nombre=${carta.name}">
                            <!-- ① Cabecera -->
                            <span class="gm-card__tier">TIER <span th:text="${carta.tier}">1</span></span>
                            <h2 class="gm-card__title" th:text="${carta.name}">Nombre</h2>
                            <span class="gm-card__role" th:text="${carta.rarity}">common</span>

                            <!-- ② Ilustración -->
                            <div class="gm-card__illustration">🎖</div>

                            <!-- ③ Reglas -->
                            <div class="gm-card__rules">
                                <p class="gm-card__meta" th:if="${!#lists.isEmpty(carta.classTags)}">
                                    <span th:each="tag,it : ${carta.classTags}"><span th:text="${tag}"></span><span th:if="${!it.last}">, </span></span>
                                </p>
                                <p class="gm-card__desc" th:text="${carta.effect != null ? carta.effect.description : ''}">Efecto</p>
                            </div>

                            <!-- ④ Pie -->
                            <div class="gm-card__footer">
                                <span class="gm-badge" th:each="tag,it : ${carta.grantedTags}" th:if="${it.index < 3}" th:text="${tag}">tag</span>
                            </div>
                            <div class="gm-card__actions">
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/dotes/{id}(id=${carta.id})}">Ver ficha</a>
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/dotes/{id}/editar(id=${carta.id})}">Editar</a>
                            </div>

                            <!-- ⑤ Identificador -->
                            <p class="gm-card__id" th:text="'dotes · ' + ${carta.id}">dotes · id</p>
                        </article>
                    </div>
                </div>
            </div>

            <!-- Plantillas ocultas: contenido de la vista previa flotante de cada carta -->
            <template th:each="carta : ${cartas}" th:id="'panel-tpl-' + ${carta.id}">
                <div class="gm-panel-section is-expanded">
                    <button type="button" class="gm-panel-section__toggle">Efecto ▾</button>
                    <div class="gm-panel-section__content">
                        <p th:text="${carta.effect != null ? carta.effect.description : ''}">Efecto</p>
                        <p class="u-italic" th:if="${carta.flavorText}" th:text="${carta.flavorText}">Texto narrativo</p>
                    </div>
                </div>
                <div class="gm-panel-section">
                    <button type="button" class="gm-panel-section__toggle">Requisitos de stat ▾</button>
                    <div class="gm-panel-section__content">
                        <p>CON ≥ <span th:text="${carta.reqCon}">0</span> · DES ≥ <span th:text="${carta.reqDes}">0</span> ·
                            CAR ≥ <span th:text="${carta.reqCar}">0</span> · INT ≥ <span th:text="${carta.reqInt}">0</span></p>
                    </div>
                </div>
                <div class="gm-panel-section">
                    <button type="button" class="gm-panel-section__toggle">Clases y tags concedidos ▾</button>
                    <div class="gm-panel-section__content">
                        <p><strong>Clases:</strong>
                            <span th:each="tag,it : ${carta.classTags}" class="gm-badge u-mr-4" th:text="${tag}">tag</span>
                            <span th:if="${#lists.isEmpty(carta.classTags)}">—</span>
                        </p>
                        <p><strong>Tags concedidos:</strong>
                            <span th:each="tag,it : ${carta.grantedTags}" class="gm-badge u-mr-4" th:text="${tag}">tag</span>
                            <span th:if="${#lists.isEmpty(carta.grantedTags)}">—</span>
                        </p>
                    </div>
                </div>
                <div class="gm-panel-section">
                    <button type="button" class="gm-panel-section__toggle">Limitaciones ▾</button>
                    <div class="gm-panel-section__content">
                        <span th:each="item,it : ${carta.limitations}" class="gm-badge u-mr-4" th:text="${item}">item</span>
                        <span th:if="${#lists.isEmpty(carta.limitations)}">Sin limitaciones.</span>
                    </div>
                </div>
                <div class="u-actions">
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/dotes/{id}(id=${carta.id})}">Abrir ficha completa</a>
                </div>
            </template><!-- Panel flotante central: vista previa de carta -->
<div id="gm-panel-backdrop" class="gm-panel-backdrop" data-panel-close></div>
<div id="gm-panel-preview" class="gm-panel" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="gm-panel__header">
        <h3 class="gm-panel__title" id="gm-panel-preview-title">Carta</h3>
        <button type="button" class="gm-panel__close" data-panel-close aria-label="Cerrar">✕</button>
    </div>
    <div class="gm-panel__body" id="gm-panel-preview-body"></div>
</div>
</main>
<th:block layout:fragment="extra-js">
<script th:inline="javascript">
    (function () {
        var texto = document.getElementById('filtro-texto');
        var rareza = document.getElementById('filtro-rareza');
        var resultado = document.getElementById('filtro-resultado');
        var tarjetas = document.querySelectorAll('#gm-album-dotes .gm-card');

        function aplicarFiltro() {
            var t = (texto.value || '').toLowerCase();
            var r = rareza.value || '';
            var visibles = 0;
            tarjetas.forEach(function (carta) {
                var nombre = (carta.getAttribute('data-nombre') || '').toLowerCase();
                var rarezaCarta = carta.getAttribute('data-rareza') || '';
                var coincide = nombre.indexOf(t) !== -1 && (r === '' || rarezaCarta === r);
                carta.style.display = coincide ? '' : 'none';
                if (coincide) visibles++;
            });
            resultado.textContent = visibles + ' de ' + tarjetas.length + ' dotes';
        }

        if (texto && rareza) {
            texto.addEventListener('input', aplicarFiltro);
            rareza.addEventListener('change', aplicarFiltro);
            aplicarFiltro();
        }
    })();
</script>
</th:block>
</body>
</html>
