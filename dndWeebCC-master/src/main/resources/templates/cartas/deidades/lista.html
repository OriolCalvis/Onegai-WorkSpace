<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Blocks/layout-gm :: layout}">
<head>
    <title layout:fragment="title">Cartas de Deidad</title>
</head>
<body>
<main layout:fragment="content">
            <div th:replace="~{Blocks/cartas-subnav-v2 :: subnav('deidades')}"></div>

            <div class="u-page-header">
                <div>
                    <p class="gm-sidebar__eyebrow u-eyebrow">Sistema de Cartas y Tiers</p>
                    <h1>Álbum de Deidades</h1>
                </div>
                <div class="u-flex-gap2">
                    <button type="button" class="gm-btn gm-btn--outline" data-panel-anchor-toggle="gm-filtros">🔍 Filtros</button>
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/deidades/nueva}">+ Nueva deidad</a>
                </div>
            </div>

            <div class="u-detail-layout-260">
                <aside id="gm-filtros" class="gm-panel gm-panel--anchored">
                    <div class="gm-panel__header">
                        <h3 class="gm-panel__title">Filtrar</h3>
                    </div>
                    <div class="gm-panel__body">
                        <div class="gm-field">
                            <label for="filtro-texto">Buscar por nombre</label>
                            <input id="filtro-texto" class="gm-input" type="text" placeholder="Ej. La Llama Eterna...">
                        </div>
                        <p class="gm-hint" id="filtro-resultado"></p>
                    </div>
                </aside>

                <div>
                    <p class="u-text-muted" th:if="${#lists.isEmpty(cartas)}">
                        Todavía no has creado ninguna carta de deidad. Empieza con la primera.
                    </p>

                    <div class="gm-album" id="gm-album-deidades">
                        <article class="gm-card" th:each="carta : ${cartas}"
                                  th:attr="data-panel-source='panel-tpl-' + ${carta.id}, data-panel-title=${carta.name}, data-nombre=${carta.name}">
                            <!-- ① Cabecera -->
                            <span class="gm-card__tier" th:text="${carta.domain}">Dominio</span>
                            <h2 class="gm-card__title" th:text="${carta.name}">Nombre</h2>
                            <span class="gm-card__role">deidad</span>

                            <!-- ② Ilustración -->
                            <div class="gm-card__illustration">✝</div>

                            <!-- ③ Reglas -->
                            <div class="gm-card__rules">
                                <p class="gm-card__desc" th:text="${carta.favor != null ? carta.favor.description : ''}">Favor</p>
                            </div>

                            <!-- ④ Pie -->
                            <div class="gm-card__footer">
                                <span class="gm-badge" th:each="c,it : ${carta.compatibleWith}" th:if="${it.index < 3}" th:text="${c}">compatible</span>
                            </div>
                            <div class="gm-card__actions">
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/deidades/{id}(id=${carta.id})}">Ver ficha</a>
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/deidades/{id}/editar(id=${carta.id})}">Editar</a>
                            </div>

                            <!-- ⑤ Identificador -->
                            <p class="gm-card__id" th:text="'deidades · ' + ${carta.id}">deidades · id</p>
                        </article>
                    </div>
                </div>
            </div>

            <template th:each="carta : ${cartas}" th:id="'panel-tpl-' + ${carta.id}">
                <div class="gm-panel-section is-expanded">
                    <button type="button" class="gm-panel-section__toggle">Favor otorgado ▾</button>
                    <div class="gm-panel-section__content">
                        <p><strong>Dominio:</strong> <span th:text="${carta.domain}"></span></p>
                        <p th:text="${carta.favor != null ? carta.favor.description : ''}">Favor</p>
                        <p class="u-italic" th:if="${carta.flavorText}" th:text="${carta.flavorText}">Texto narrativo</p>
                    </div>
                </div>
                <div class="gm-panel-section">
                    <button type="button" class="gm-panel-section__toggle">Compatibilidad y obligaciones ▾</button>
                    <div class="gm-panel-section__content">
                        <p><strong>Compatible con:</strong>
                            <span th:each="c,it : ${carta.compatibleWith}" class="gm-badge u-mr-4" th:text="${c}">c</span>
                            <span th:if="${#lists.isEmpty(carta.compatibleWith)}">—</span>
                        </p>
                        <p><strong>Obligaciones:</strong>
                            <span th:each="o,it : ${carta.obligations}" class="gm-badge u-mr-4" th:text="${o}">o</span>
                            <span th:if="${#lists.isEmpty(carta.obligations)}">Ninguna.</span>
                        </p>
                    </div>
                </div>
                <div class="u-actions">
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/deidades/{id}(id=${carta.id})}">Abrir ficha completa</a>
                </div>
            </template><div id="gm-panel-backdrop" class="gm-panel-backdrop" data-panel-close></div>
<div id="gm-panel-preview" class="gm-panel" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="gm-panel__header">
        <h3 class="gm-panel__title" id="gm-panel-preview-title">Carta</h3>
        <button type="button" class="gm-panel__close" data-panel-close aria-label="Cerrar">✕</button>
    </div>
    <div class="gm-panel__body" id="gm-panel-preview-body"></div>
</div>
</main>
<th:block layout:fragment="extra-js">
<script th:inline="javascript">
    (function () {
        var texto = document.getElementById('filtro-texto');
        var resultado = document.getElementById('filtro-resultado');
        var tarjetas = document.querySelectorAll('#gm-album-deidades .gm-card');

        function aplicarFiltro() {
            var t = (texto.value || '').toLowerCase();
            var visibles = 0;
            tarjetas.forEach(function (carta) {
                var nombre = (carta.getAttribute('data-nombre') || '').toLowerCase();
                var coincide = nombre.indexOf(t) !== -1;
                carta.style.display = coincide ? '' : 'none';
                if (coincide) visibles++;
            });
            resultado.textContent = visibles + ' de ' + tarjetas.length + ' deidades';
        }

        if (texto) {
            texto.addEventListener('input', aplicarFiltro);
            aplicarFiltro();
        }
    })();
</script>
</th:block>
</body>
</html>
