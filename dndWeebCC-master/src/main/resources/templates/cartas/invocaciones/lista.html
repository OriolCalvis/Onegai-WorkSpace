<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Blocks/layout-gm :: layout}">
<head>
    <title layout:fragment="title">Cartas de Invocación</title>
</head>
<body>
<main layout:fragment="content">
            <div th:replace="~{Blocks/cartas-subnav-v2 :: subnav('invocaciones')}"></div>

            <div class="u-page-header">
                <div>
                    <p class="gm-sidebar__eyebrow u-eyebrow">Sistema de Cartas y Tiers</p>
                    <h1>Álbum de Invocaciones</h1>
                </div>
                <div class="u-flex-gap2">
                    <button type="button" class="gm-btn gm-btn--outline" data-panel-anchor-toggle="gm-filtros">🔍 Filtros</button>
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/invocaciones/nueva}">+ Nueva invocación</a>
                </div>
            </div>

            <div class="u-detail-layout-260">
                <aside id="gm-filtros" class="gm-panel gm-panel--anchored">
                    <div class="gm-panel__header">
                        <h3 class="gm-panel__title">Filtrar</h3>
                    </div>
                    <div class="gm-panel__body">
                        <div class="gm-field">
                            <label for="filtro-texto">Buscar por nombre</label>
                            <input id="filtro-texto" class="gm-input" type="text" placeholder="Ej. Lobo Espectral...">
                        </div>
                        <p class="gm-hint" id="filtro-resultado"></p>
                    </div>
                </aside>

                <div>
                    <p class="u-text-muted" th:if="${#lists.isEmpty(cartas)}">
                        Todavía no has creado ninguna carta de invocación. Empieza con la primera.
                    </p>

                    <div class="gm-album" id="gm-album-invocaciones">
                        <article class="gm-card" th:each="carta : ${cartas}"
                                  th:attr="data-panel-source='panel-tpl-' + ${carta.id}, data-panel-title=${carta.name}, data-nombre=${carta.name}">
                            <!-- ① Cabecera -->
                            <span class="gm-card__tier">TIER <span th:text="${carta.tier}">1</span></span>
                            <h2 class="gm-card__title" th:text="${carta.name}">Nombre</h2>
                            <span class="gm-card__role" th:text="${carta.control}">automatica</span>

                            <!-- ② Ilustración -->
                            <div class="gm-card__illustration">👻</div>

                            <!-- ③ Reglas -->
                            <div class="gm-card__rules">
                                <p class="gm-card__meta">Vida <span th:text="${carta.health}">0</span> · Mov. <span th:text="${carta.movement}">0</span></p>
                                <p class="gm-card__desc" th:text="${carta.passive != null ? carta.passive.description : ''}">Pasiva</p>
                            </div>

                            <!-- ④ Pie -->
                            <div class="gm-card__footer">
                                <span class="gm-badge" th:text="${carta.duration}">duración</span>
                            </div>
                            <div class="gm-card__actions">
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/invocaciones/{id}(id=${carta.id})}">Ver ficha</a>
                                <a class="gm-btn gm-btn--outline gm-btn--sm" th:href="@{/cartas/invocaciones/{id}/editar(id=${carta.id})}">Editar</a>
                            </div>

                            <!-- ⑤ Identificador -->
                            <p class="gm-card__id" th:text="'invocaciones · ' + ${carta.id}">invocaciones · id</p>
                        </article>
                    </div>
                </div>
            </div>

            <template th:each="carta : ${cartas}" th:id="'panel-tpl-' + ${carta.id}">
                <div class="gm-panel-section is-expanded">
                    <button type="button" class="gm-panel-section__toggle">Ataques ▾</button>
                    <div class="gm-panel-section__content">
                        <p th:each="ataque : ${carta.attacks}"><strong th:text="${ataque.name}">Nombre</strong> — <span th:text="${ataque.effect}">efecto</span></p>
                        <p th:if="${#lists.isEmpty(carta.attacks)}">Sin ataques definidos.</p>
                    </div>
                </div>
                <div class="gm-panel-section">
                    <button type="button" class="gm-panel-section__toggle">Pasiva ▾</button>
                    <div class="gm-panel-section__content">
                        <p><strong th:text="${carta.passive != null ? carta.passive.name : ''}">Nombre</strong></p>
                        <p th:text="${carta.passive != null ? carta.passive.description : ''}">Descripción</p>
                        <p class="u-italic" th:if="${carta.flavorText}" th:text="${carta.flavorText}">Texto narrativo</p>
                    </div>
                </div>
                <div class="u-actions">
                    <a class="gm-btn gm-btn--primary" th:href="@{/cartas/invocaciones/{id}(id=${carta.id})}">Abrir ficha completa</a>
                </div>
            </template><div id="gm-panel-backdrop" class="gm-panel-backdrop" data-panel-close></div>
<div id="gm-panel-preview" class="gm-panel" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="gm-panel__header">
        <h3 class="gm-panel__title" id="gm-panel-preview-title">Carta</h3>
        <button type="button" class="gm-panel__close" data-panel-close aria-label="Cerrar">✕</button>
    </div>
    <div class="gm-panel__body" id="gm-panel-preview-body"></div>
</div>
</main>
<th:block layout:fragment="extra-js">
<script th:inline="javascript">
    (function () {
        var texto = document.getElementById('filtro-texto');
        var resultado = document.getElementById('filtro-resultado');
        var tarjetas = document.querySelectorAll('#gm-album-invocaciones .gm-card');

        function aplicarFiltro() {
            var t = (texto.value || '').toLowerCase();
            var visibles = 0;
            tarjetas.forEach(function (carta) {
                var nombre = (carta.getAttribute('data-nombre') || '').toLowerCase();
                var coincide = nombre.indexOf(t) !== -1;
                carta.style.display = coincide ? '' : 'none';
                if (coincide) visibles++;
            });
            resultado.textContent = visibles + ' de ' + tarjetas.length + ' invocaciones';
        }

        if (texto) {
            texto.addEventListener('input', aplicarFiltro);
            aplicarFiltro();
        }
    })();
</script>
</th:block>
</body>
</html>
